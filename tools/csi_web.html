<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CSI 采集</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f3f3f1; --surface-1: #fcfcfb; --border: #dddcd7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --grid: #e6e5e0; --axis: #b9b8b1; --crosshair: #52514e;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
  --rec: #d03b3b; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2a27; --axis: #4a4943; --crosshair: #c3c2b7;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
    --rec: #e66767; --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--surface-0); color: var(--text-primary); }
header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; }
header h1 { font-size: 16px; margin: 0; }
#status, #msg { color: var(--text-secondary); }
#rec { color: var(--rec); font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 8px 16px;
       background: var(--surface-1); border-block: 1px solid var(--border); }
.bar label { color: var(--text-secondary); display: flex; gap: 6px; align-items: center; }
input, select, button { font: inherit; color: var(--text-primary); background: var(--surface-0);
       border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
input[type=number] { width: 72px; }
button { cursor: pointer; }
button.rec-on { border-color: var(--rec); color: var(--rec); }
#cards { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; min-width: 210px; }
.card .name { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.card .sw { width: 14px; height: 3px; border-radius: 2px; }
.card .mac { color: var(--text-muted); font-weight: 400; font-size: 11px; }
.card table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
.card td { padding: 0 10px 0 0; color: var(--text-secondary); }
.card td.v { color: var(--text-primary); text-align: right; }
.card.off { opacity: .55; }
.panel { position: relative; margin: 0 16px 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
.panel h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
.panel h2 span { color: var(--text-muted); font-weight: 400; }
.legend { display: flex; gap: 14px; color: var(--text-secondary); margin-bottom: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
canvas { display: block; width: 100%; }
#tip { position: absolute; pointer-events: none; display: none; background: var(--surface-1); border: 1px solid var(--border);
       border-radius: 4px; padding: 4px 8px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px #0003; }
#tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body class="viz-root">
<header>
  <h1>CSI 采集</h1>
  <span id="status">连接中…</span>
  <span id="rec"></span>
  <span id="msg"></span>
</header>

<div class="bar">
  <label>子载波 <input id="sc" type="number" min="-122" max="122" step="1" value="20">
    <input id="scRange" type="range" min="-122" max="122" value="20" style="width:220px"></label>
  <label>时间窗 <select id="win"><option>5</option><option selected>10</option><option>30</option><option>60</option></select> s</label>
  <label>LO <select id="lo"><option value="2412">2412（信道 1）</option><option value="2440">2440（整数分频）</option><option value="">自定义</option></select>
    <input id="loCustom" type="number" min="2300" max="2500" value="2420" hidden> MHz <button id="loApply">改频</button></label>
  <label>增益 <button id="gLock">锁定</button><button id="gAuto">自动</button></label>
  <label>记录名 <input id="recName" placeholder="可选" style="width:140px"> <button id="recBtn">开始记录</button></label>
</div>

<div id="cards"></div>

<div class="panel">
  <h2>幅值 · 子载波 <span id="scTitle">20</span> <span>（横轴：相对最新帧的秒数，按 tx_seq 对齐；断线 = 丢包）</span></h2>
  <div class="legend" id="legend1"></div>
  <canvas id="ts" height="320"></canvas>
  <div id="tip"></div>
</div>
<div class="panel">
  <h2>当前帧幅值谱 <span>（点击选择子载波；只显示 ±2…±122）</span></h2>
  <canvas id="spec" height="200"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const KNOWN = ["98:88:E0:76:5D:68", "98:88:E0:76:07:C4", "98:88:E0:76:4D:04"];  // A, B, C -> slots 1..3
const slotOf = {};   // mac -> colour slot, fixed for the page lifetime (colour follows the device)
function colorOf(mac) {
  if (!(mac in slotOf)) {
    const k = KNOWN.indexOf(mac);
    const used = new Set(Object.values(slotOf));
    let s = k >= 0 ? k + 1 : 4;
    while (k < 0 && used.has(s) && s < 6) s++;
    slotOf[mac] = s;
  }
  return css(`--series-${slotOf[mac]}`);
}
const SPEC_SC = []; for (let k = -122; k <= 122; k++) if (Math.abs(k) >= 2) SPEC_SC.push(k);

let sc = 20, last = null, rate = 100;
const buf = {};          // mac -> [[tx_seq, amp], ...]
const spec = {};         // mac -> amps over SPEC_SC
let hoverX = null;

async function post(path, body) {
  const r = await fetch(path, {method: "POST", body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) $("msg").textContent = "错误：" + j.error;
}
function setSc(v) {
  v = Math.max(-122, Math.min(122, Math.round(+v)));
  if (Math.abs(v) < 2) v = v < 0 ? -2 : 2;
  $("sc").value = $("scRange").value = v;
  post("/api/select", {sc: v});
}
$("sc").onchange = e => setSc(e.target.value);
$("scRange").oninput = e => setSc(e.target.value);
$("lo").onchange = () => $("loCustom").hidden = $("lo").value !== "";
$("loApply").onclick = () => post("/api/lo", {mhz: +($("lo").value || $("loCustom").value)});
$("gLock").onclick = () => post("/api/gain", {mode: "lock"});
$("gAuto").onclick = () => post("/api/gain", {mode: "auto"});
$("recBtn").onclick = () => post("/api/record", last && last.rec ? {action: "stop"} : {action: "start", name: $("recName").value});

const es = new EventSource("/events");
es.onopen = () => $("status").textContent = "已连接服务器";
es.onerror = () => $("status").textContent = "服务器断开，重连中…";
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.sc !== sc) {            // new subcarrier: the old series means something else
    sc = m.sc; for (const k in buf) buf[k] = [];
    $("scTitle").textContent = sc;
    if (document.activeElement !== $("sc")) $("sc").value = $("scRange").value = sc;
  }
  let fpsMax = 0;
  for (const d of m.devices) {
    if (d.role !== "rx") continue;
    const b = (buf[d.mac] ||= []);
    if (b.length && d.pts.length && d.pts[0][0] < b[b.length - 1][0]) b.length = 0;  // tx_seq restarted (TX reboot)
    b.push(...d.pts);
    if (d.spec) spec[d.mac] = d.spec;
    fpsMax = Math.max(fpsMax, d.fps);
  }
  if (fpsMax > 0) rate = 0.8 * rate + 0.2 * fpsMax;
  const keep = Math.ceil(70 * rate);  // longest window + margin
  for (const k in buf) if (buf[k].length > keep) buf[k].splice(0, buf[k].length - keep);
  last = m;
  renderInfo(m);
};

const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"})[c]);
function fmt(v, d = 0) { return v == null ? "–" : (+v).toFixed(d); }
function renderInfo(m) {
  const rx = m.devices.filter(d => d.role === "rx");
  $("status").textContent = `接收端 ${rx.length} 个` + (m.devices.some(d => d.role === "tx") ? " · TX 已连接" : " · TX 未连接")
    + (m.devices.some(d => d.role === "busy") ? " · 有端口被其它进程占用，未连接" : "");
  $("rec").textContent = m.rec ? `● 记录中 ${m.rec.elapsed.toFixed(0)} s → ${m.rec.dir}` : "";
  $("recBtn").textContent = m.rec ? "停止记录" : "开始记录";
  $("recBtn").className = m.rec ? "rec-on" : "";
  $("msg").textContent = m.message;
  $("cards").innerHTML = m.devices.map(d => {
    const rxd = d.role === "rx";
    const sw = rxd ? `<span class="sw" style="background:${colorOf(d.mac)}"></span>` : "";
    const rows = rxd ? [
      ["帧率", fmt(d.fps) + " /s"], ["丢包 (10 s)", fmt(d.loss, 2) + " %"], ["RSSI", fmt(d.rssi) + " dBm"],
      ["AGC / FFT", `${fmt(d.agc)} / ${fmt(d.fft)}` + (d.gain_forced ? " 锁" : "")],
      ["温度", fmt(d.temp) + " ℃"], ["LO", d.lo ? d.lo + " MHz" : `信道 ${fmt(d.channel)}`],
      ["CRC 错", fmt(d.crc)], ...(m.rec ? [["已记录", fmt(d.rec_frames)]] : [])
    ] : d.role === "busy" ? [["被占用", ""], ...d.busy.map(b => [b.split(" ")[0], esc(b.slice(b.indexOf(" ") + 1, b.indexOf(" ") + 40))])]
      : [["角色", d.role === "tx" ? "发射端" : "无 CSI 帧"]];
    return `<div class="card${d.fps || !rxd ? "" : " off"}"><div class="name">${sw}${d.label} <span class="mac">${d.mac}</span></div>
      <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td class="v">${v}</td></tr>`).join("")}</table></div>`;
  }).join("");
  const leg = rx.map(d => `<span><i style="background:${colorOf(d.mac)}"></i>${d.label}</span>`).join("");
  if ($("legend1").innerHTML !== leg) $("legend1").innerHTML = leg;
}

function setup(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1, h = +cv.getAttribute("height");
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + "px"; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, r.width, h);
  return [g, r.width, h];
}
function niceTicks(lo, hi, n) {
  const step0 = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(step0)), f = step0 / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p, t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(+v.toFixed(6));
  return t;
}
function axes(g, W, H, P, xs, ys, xmap, ymap, xfmt) {
  g.font = "11px system-ui"; g.lineWidth = 1;
  g.strokeStyle = css("--grid"); g.fillStyle = css("--text-muted");
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const y of ys) { const py = ymap(y); g.beginPath(); g.moveTo(P.l, py); g.lineTo(W - P.r, py); g.stroke(); g.fillText(y, P.l - 6, py); }
  g.textAlign = "center"; g.textBaseline = "top";
  for (const x of xs) g.fillText(xfmt(x), xmap(x), H - P.b + 5);
  g.strokeStyle = css("--axis"); g.beginPath(); g.moveTo(P.l, H - P.b); g.lineTo(W - P.r, H - P.b); g.stroke();
}

function drawTs() {
  const cv = $("ts"), [g, W, H] = setup(cv), P = {l: 44, r: 120, t: 8, b: 22};
  const win = +$("win").value, macs = Object.keys(buf).filter(k => buf[k].length);
  if (!macs.length) return;
  const newest = Math.max(...macs.map(k => buf[k][buf[k].length - 1][0]));
  const span = win * rate, x0 = newest - span;
  let ymax = 1;
  for (const k of macs) for (const [s, a] of buf[k]) if (s >= x0 && a > ymax) ymax = a;
  const ys = niceTicks(0, ymax * 1.08, 5), yTop = Math.max(ys[ys.length - 1], ymax * 1.08);
  const xmap = s => P.l + (s - x0) / span * (W - P.l - P.r);
  const ymap = a => H - P.b - a / yTop * (H - P.t - P.b);
  axes(g, W, H, P, niceTicks(-win, 0, 8), ys, t => xmap(newest + t * rate), ymap, t => t + " s");
  g.lineWidth = 2; g.lineJoin = "round";
  const ends = [];
  for (const k of macs) {
    const pts = buf[k]; g.strokeStyle = colorOf(k); g.beginPath();
    let prev = null;
    for (const [s, a] of pts) {
      if (s < x0) continue;
      if (prev !== null && s - prev === 1) g.lineTo(xmap(s), ymap(a)); else g.moveTo(xmap(s), ymap(a));
      prev = s;
    }
    g.stroke();
    const e = pts[pts.length - 1];
    ends.push({k, y: ymap(e[1]), a: e[1]});
  }
  // Direct labels at the right edge, pushed apart so they don't overlap.
  ends.sort((p, q) => p.y - q.y);
  for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 14);
  g.font = "11px system-ui"; g.textAlign = "left"; g.textBaseline = "middle";
  const lbl = Object.fromEntries((last ? last.devices : []).map(d => [d.mac, d.label]));
  for (const e of ends) {
    g.fillStyle = colorOf(e.k); g.fillRect(W - P.r + 6, e.y - 1.5, 10, 3);
    g.fillStyle = css("--text-secondary"); g.fillText(`${lbl[e.k] || e.k.slice(-5)} ${e.a.toFixed(1)}`, W - P.r + 20, e.y);
  }
  // Crosshair + tooltip: nearest tx_seq.
  const tip = $("tip");
  if (hoverX === null || hoverX < P.l || hoverX > W - P.r) { tip.style.display = "none"; return; }
  const s = Math.round(x0 + (hoverX - P.l) / (W - P.l - P.r) * span), px = xmap(s);
  g.strokeStyle = css("--crosshair"); g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(px, P.t); g.lineTo(px, H - P.b); g.stroke(); g.setLineDash([]);
  const rows = macs.map(k => {
    const p = buf[k].find(q => q[0] === s);
    if (p) { g.fillStyle = colorOf(k); g.strokeStyle = css("--surface-1"); g.lineWidth = 2;
      g.beginPath(); g.arc(px, ymap(p[1]), 4, 0, 7); g.fill(); g.stroke(); }
    return `<div><i style="background:${colorOf(k)}"></i>${lbl[k] || k} ${p ? p[1].toFixed(1) : "丢失"}</div>`;
  });
  tip.innerHTML = `<div>tx_seq ${s} · ${((s - newest) / rate).toFixed(2)} s</div>` + rows.join("");
  tip.style.display = "block";
  tip.style.left = Math.min(px + 24, W - 150) + "px";
  tip.style.top = "60px";
}
$("ts").onmousemove = e => hoverX = e.offsetX;
$("ts").onmouseleave = () => hoverX = null;

function drawSpec() {
  const cv = $("spec"), [g, W, H] = setup(cv), P = {l: 44, r: 120, t: 8, b: 22};
  const macs = Object.keys(spec);
  let ymax = 1;
  for (const k of macs) for (const a of spec[k]) ymax = Math.max(ymax, a);
  const ys = niceTicks(0, ymax * 1.08, 4), yTop = Math.max(ys[ys.length - 1], ymax * 1.08);
  const xmap = k => P.l + (k + 122) / 244 * (W - P.l - P.r), ymap = a => H - P.b - a / yTop * (H - P.t - P.b);
  axes(g, W, H, P, [-120, -80, -40, 0, 40, 80, 120], ys, xmap, ymap, x => x);
  g.lineWidth = 2; g.lineJoin = "round";
  for (const k of macs) {
    g.strokeStyle = colorOf(k); g.beginPath();
    spec[k].forEach((a, i) => {        // break at the DC gap (-2 -> +2)
      const x = SPEC_SC[i];
      if (i === 0 || x === 2) g.moveTo(xmap(x), ymap(a)); else g.lineTo(xmap(x), ymap(a));
    });
    g.stroke();
  }
  g.strokeStyle = css("--crosshair"); g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(xmap(sc), P.t); g.lineTo(xmap(sc), H - P.b); g.stroke(); g.setLineDash([]);
  cv.onclick = e => setSc((e.offsetX - P.l) / (W - P.l - P.r) * 244 - 122);
}

(function loop() { drawTs(); drawSpec(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
